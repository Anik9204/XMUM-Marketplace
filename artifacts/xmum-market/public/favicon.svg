<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background: rounded square -->
  <rect width="32" height="32" rx="7" fill="#003366"/>
  <!-- Bag body: trapezoid -->
  <polygon points="5,14 27,14 25,27 7,27" fill="#0055CC"/>
  <!-- Bag cuff (top fold line) -->
  <rect x="5" y="14" width="22" height="3" fill="#003D99"/>
  <!-- Left handle arch -->
  <path d="M9,14 Q12,8 15,14" stroke="#003D99" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Right handle arch -->
  <path d="M17,14 Q20,8 23,14" stroke="#003D99" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- XM text -->
  <text x="16" y="23" font-family="'Nunito','Inter',sans-serif" font-weight="800" font-size="7" fill="#FFFFFF" text-anchor="middle">XM</text>
</svg>
