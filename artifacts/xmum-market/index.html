<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('xmum-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (!stored && prefersDark);
          if (!stored) {
            localStorage.setItem('xmum-theme', dark ? 'dark' : 'light');
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical: paint correct background BEFORE Tailwind CSS loads (prevents FOUC) */
      html { background-color: #F8FAFC; }
      html.dark { background-color: #0F172A; }
    </style>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="zpmLqTnfDw_2WVuC4iEDkJZew-4iBT6FD3LHoQD9KI4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XMUM Market</title>
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://apis.google.com
        https://*.firebaseapp.com https://*.googleapis.com 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:
        https://*.googleapis.com
        https://*.googleusercontent.com
        https://firebasestorage.googleapis.com
        https://ui-avatars.com;
      connect-src 'self' https://*.googleapis.com
        https://*.firebaseio.com
        https://firestore.googleapis.com
        wss://*.firebaseio.com
        wss://*.replit.dev
        https://*.replit.dev;
      frame-src https://*.firebaseapp.com;
    " />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#003366" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XMUM Market" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- SEO / Social -->
    <meta name="description" content="XMUM Market — The student marketplace for Xiamen University Malaysia. Buy, sell, find lost items, browse jobs, and explore campus shops." />
    <link rel="canonical" href="https://www.xmummarket.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.xmummarket.com/" />
    <meta property="og:site_name" content="XMUM Market" />
    <meta property="og:title" content="XMUM Market — Student Marketplace for XMUM" />
    <meta property="og:description" content="The student marketplace for Xiamen University Malaysia. Buy, sell, find lost items, browse jobs, and explore campus shops." />
    <meta property="og:image" content="https://www.xmummarket.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_MY" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XMUM Market — Student Marketplace for XMUM" />
    <meta name="twitter:description" content="The student marketplace for Xiamen University Malaysia. Buy, sell, find lost items, browse jobs, and explore campus shops." />
    <meta name="twitter:image" content="https://www.xmummarket.com/opengraph.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "XMUM Market",
  "url": "https://www.xmummarket.com",
  "description": "The student marketplace for Xiamen University Malaysia students.",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://www.xmummarket.com/search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
