<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('xmum-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (!stored && prefersDark);
          if (!stored) {
            localStorage.setItem('xmum-theme', dark ? 'dark' : 'light');
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical: paint correct background BEFORE Tailwind CSS loads (prevents FOUC) */
      html { background-color: #F8FAFC; }
      html.dark { background-color: #0F172A; }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XMUM Market</title>
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://apis.google.com
        https://*.firebaseapp.com https://*.googleapis.com 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:
        https://*.googleapis.com
        https://*.googleusercontent.com
        https://firebasestorage.googleapis.com
        https://ui-avatars.com;
      connect-src 'self' https://*.googleapis.com
        https://*.firebaseio.com
        https://firestore.googleapis.com
        wss://*.firebaseio.com
        wss://*.replit.dev
        https://*.replit.dev;
      frame-src https://*.firebaseapp.com;
    " />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#003366" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XMUM Market" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SEO / Social -->
    <meta name="description" content="XMUM Market — The community marketplace for Xiamen University Malaysia students. Buy, sell, and find lost items within the XMUM campus community." />
    <meta property="og:title" content="XMUM Market" />
    <meta property="og:description" content="The community marketplace for XMUM students." />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
